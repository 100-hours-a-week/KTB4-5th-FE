name: FE v1 CI-CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# 같은 브랜치의 이전 배포가 끝나기 전에 새 배포가 앞서지 않도록 직렬화한다.
concurrency:
  group: v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 검증 및 이미지 빌드
    # dev(v2, t3)는 amd64, main(v1 prod, t4g)은 ARM 러너에서 해당 아키텍처만 빌드한다.
    runs-on: ${{ github.ref_name == 'main' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 공개 API 주소 확인
        env:
          API_URL: ${{ github.event_name == 'pull_request' && 'https://example.invalid' || (github.ref_name == 'main' && vars.PROD_API_BASE_URL || vars.DEV_API_BASE_URL) }}
        run: |
          test -n "$API_URL" || { echo "환경별 API 주소를 등록하세요."; exit 1; }
          echo "NEXT_PUBLIC_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"
      - name: Sentry 설정 확인
        env:
          SENTRY_DSN: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            test -n "$SENTRY_DSN" || { echo "SENTRY_DSN Repository Variable을 등록하세요."; exit 1; }
            test -n "$SENTRY_AUTH_TOKEN" || { echo "SENTRY_AUTH_TOKEN Repository Secret을 등록하세요."; exit 1; }
          fi
          echo "NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN" >> "$GITHUB_ENV"
      - name: 이미지 이름
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드 및 푸시
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.ref_name == 'main' && 'linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ github.event_name == 'pull_request' && 'test' || (github.ref_name == 'main' && 'production' || 'dev') }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_MSW=${{ github.event_name == 'push' && github.ref_name == 'dev' && 'true' || 'false' }}
            NEXT_PUBLIC_KAKAOTECH_INVITE_CODE=562R2A
          secrets: |
            SENTRY_AUTH_TOKEN=${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 배포 이미지 고정
        id: reference
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  build-v2:
    name: v2 이미지 빌드 (main, amd64)
    # v2(stage·prod)는 x86(t3)이라 main에서도 amd64 이미지를 따로 만든다. v1 prod가 내려가면 build로 합친다.
    # API는 같은 주소의 /api/v1(상대 경로)로 부르므로 이미지 하나를 stage·prod에 그대로 쓴다.
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 이미지 이름
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드 및 푸시
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}-amd64
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PROD_API_BASE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_MSW=false
            NEXT_PUBLIC_KAKAOTECH_INVITE_CODE=562R2A
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=v2
          cache-to: type=gha,mode=max,scope=v2
      - name: 배포 이미지 고정
        id: reference
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: 배포
    # stage 배포가 끝난 뒤 GitHub Environment "prod" 승인을 받아야 v1 prod에 배포한다.
    needs: [build, deploy-stage]
    environment: prod
    # dev는 v2(ECS)로 전환되어 deploy-v2가 배포한다. 이 job은 prod(main)를 명시적으로 활성화했을 때만 배포한다.
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'main' && vars.CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 값은 Environment가 아니라 브랜치별 Repository 설정에서 고른다 (Environment는 승인용).
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH 배포
        env:
          DEPLOY_HOST: ${{ github.ref_name == 'main' && vars.PROD_DEPLOY_HOST || vars.DEV_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_PROJECT: ${{ vars.COMPOSE_PROJECT }}
          COMPOSE_FILE_NAME: ${{ vars.COMPOSE_FILE_NAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ github.ref_name == 'main' && secrets.PROD_SSH_KNOWN_HOSTS || secrets.DEV_SSH_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 프론트엔드 실행 환경변수는 개발과 운영에서 공통으로 사용한다.
          APP_ENV: ${{ secrets.APP_ENV }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$COMPOSE_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$COMPOSE_FILE_NAME" =~ ^[a-zA-Z0-9._-]+\.ya?ml$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "$GHCR_USER" =~ ^[a-zA-Z0-9_-]+(\[bot\])?$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$GHCR_TOKEN"
          if [[ -z "$APP_ENV" ]]; then
            echo "::error::FE 저장소에 APP_ENV Secret을 등록하세요."
            exit 1
          fi
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          # 첫 줄은 GHCR 인증 토큰, 나머지는 프론트엔드 환경설정으로 전달한다.
          { printf '%s\n' "$GHCR_TOKEN"; printf '%s\n' "$APP_ENV"; } | ssh -i "$key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash scripts/deploy-v1.sh frontend '$IMAGE' '$COMPOSE_PROJECT' '$COMPOSE_FILE_NAME' '$GHCR_USER'"

  deploy-v2:
    name: v2 dev 배포
    needs: build
    # 배포 절차는 CLOUD 저장소가 관리한다. 여기서는 빌드한 이미지만 넘긴다.
    if: github.event_name == 'push' && github.ref_name == 'dev'
    permissions:
      contents: read
      id-token: write
    uses: 100-hours-a-week/KTB4-5th-CLOUD/.github/workflows/ecs-deploy.yml@main
    with:
      service: frontend
      image: ${{ needs.build.outputs.image }}

  deploy-stage:
    name: v2 stage 배포
    needs: [build, build-v2]
    # main에 합쳐진 이미지를 stage에 바로 배포한다. prod는 이 이미지(digest)를 승인 후 그대로 쓴다.
    if: github.event_name == 'push' && github.ref_name == 'main'
    permissions:
      contents: read
      id-token: write
    uses: 100-hours-a-week/KTB4-5th-CLOUD/.github/workflows/ecs-deploy.yml@main
    with:
      env: stage
      service: app
      container: frontend
      image: ${{ needs.build-v2.outputs.image }}
