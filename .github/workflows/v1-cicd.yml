name: FE v1 CI-CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# 같은 브랜치의 이전 배포가 끝나기 전에 새 배포가 앞서지 않도록 직렬화한다.
concurrency:
  group: v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 검증 및 이미지 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 공개 API 주소 확인
        env:
          API_URL: ${{ github.event_name == 'pull_request' && 'https://example.invalid' || (github.ref_name == 'main' && vars.PROD_API_BASE_URL || vars.DEV_API_BASE_URL) }}
        run: |
          test -n "$API_URL" || { echo "환경별 API 주소를 등록하세요."; exit 1; }
          echo "NEXT_PUBLIC_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"
      - name: Sentry 설정 확인
        env:
          SENTRY_DSN: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            test -n "$SENTRY_DSN" || { echo "SENTRY_DSN Repository Variable을 등록하세요."; exit 1; }
            test -n "$SENTRY_AUTH_TOKEN" || { echo "SENTRY_AUTH_TOKEN Repository Secret을 등록하세요."; exit 1; }
          fi
          echo "NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN" >> "$GITHUB_ENV"
      - name: 이미지 이름
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # AMD64 러너에서 ARM64 이미지도 빌드할 수 있도록 에뮬레이션을 준비한다.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: AMD64·ARM64 이미지 빌드 및 푸시
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: .
          # 하나의 태그와 인덱스 다이제스트로 t3와 t4g에 맞는 이미지를 선택한다.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ github.event_name == 'pull_request' && 'test' || (github.ref_name == 'main' && 'production' || 'dev') }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_MSW=${{ github.event_name == 'push' && github.ref_name == 'dev' && 'true' || 'false' }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 배포 이미지 고정
        id: reference
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: 배포
    needs: build
    # dev는 항상 자동 배포하고, prod(main)는 명시적으로 활성화했을 때만 배포한다.
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'dev' ||
      (github.ref_name == 'main' && vars.CD_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # GitHub Environments 없이 브랜치별 Repository 설정을 선택한다.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH 배포
        env:
          DEPLOY_HOST: ${{ github.ref_name == 'main' && vars.PROD_DEPLOY_HOST || vars.DEV_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_PROJECT: ${{ vars.COMPOSE_PROJECT }}
          COMPOSE_FILE_NAME: ${{ vars.COMPOSE_FILE_NAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ github.ref_name == 'main' && secrets.PROD_SSH_KNOWN_HOSTS || secrets.DEV_SSH_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 프론트엔드 실행 환경변수는 개발과 운영에서 공통으로 사용한다.
          APP_ENV: ${{ secrets.APP_ENV }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$COMPOSE_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$COMPOSE_FILE_NAME" =~ ^[a-zA-Z0-9._-]+\.ya?ml$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "$GHCR_USER" =~ ^[a-zA-Z0-9_-]+(\[bot\])?$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$GHCR_TOKEN"
          if [[ -z "$APP_ENV" ]]; then
            echo "::error::FE 저장소에 APP_ENV Secret을 등록하세요."
            exit 1
          fi
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          # 첫 줄은 GHCR 인증 토큰, 나머지는 프론트엔드 환경설정으로 전달한다.
          { printf '%s\n' "$GHCR_TOKEN"; printf '%s\n' "$APP_ENV"; } | ssh -i "$key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash scripts/deploy-v1.sh frontend '$IMAGE' '$COMPOSE_PROJECT' '$COMPOSE_FILE_NAME' '$GHCR_USER'"
