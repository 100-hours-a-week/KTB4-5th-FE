name: FE v1 CI-CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# 같은 브랜치의 이전 배포가 끝나기 전에 새 배포가 앞서지 않도록 직렬화한다.
concurrency:
  group: v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 검증 및 이미지 빌드
    # 모든 환경의 이미지를 AMD64로 한 번만 빌드한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 공개 API 주소 확인
        env:
          API_URL: ${{ github.event_name == 'pull_request' && 'https://example.invalid' || (github.ref_name == 'main' && vars.PROD_API_BASE_URL || vars.DEV_API_BASE_URL) }}
        run: |
          test -n "$API_URL" || { echo "환경별 API 주소를 등록하세요."; exit 1; }
          echo "NEXT_PUBLIC_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"
      - name: Sentry 설정 확인
        env:
          SENTRY_DSN: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            test -n "$SENTRY_DSN" || { echo "SENTRY_DSN Repository Variable을 등록하세요."; exit 1; }
            test -n "$SENTRY_AUTH_TOKEN" || { echo "SENTRY_AUTH_TOKEN Repository Secret을 등록하세요."; exit 1; }
          fi
          echo "NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN" >> "$GITHUB_ENV"
      - name: 이미지 이름
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드 및 푸시
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ github.event_name == 'pull_request' && 'test' || (github.ref_name == 'main' && 'production' || 'dev') }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_MSW=${{ github.event_name == 'push' && github.ref_name == 'dev' && 'true' || 'false' }}
            NEXT_PUBLIC_KAKAOTECH_INVITE_CODE=562R2A
          secrets: |
            SENTRY_AUTH_TOKEN=${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 배포 이미지 고정
        id: reference
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  request-prod:
    name: 앱 prod 승인 및 CLOUD 승인 요청
    needs: [build, deploy-stage]
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: prod
    steps:
      - name: CLOUD 승인 워크플로 실행
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "CLOUD_DISPATCH_TOKEN Secret이 필요합니다."; exit 1; }
          jq -n --arg repository "$SOURCE_REPO" --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" --arg image "$IMAGE" \
            '{ref:"main", inputs:{repository:$repository, run_id:$run_id, run_attempt:$run_attempt, image:$image}}' |
            gh api --method POST repos/100-hours-a-week/KTB4-5th-CLOUD/actions/workflows/prod-approval.yml/dispatches --input -
          # 앱 실행은 요청 접수까지 담당하고 승인·운영 배포 결과는 CLOUD에서 확인한다.
          {
            echo '### CLOUD prod 배포 요청 접수 완료'
            echo 'stage 배포와 요청 전달이 완료되었습니다. prod 배포 완료를 뜻하지 않습니다.'
            echo '[CLOUD 승인 및 배포 실행 확인](https://github.com/100-hours-a-week/KTB4-5th-CLOUD/actions/workflows/prod-approval.yml)'
            printf -- '- 요청 실행: `%s.%s`\n' "$RUN_ID" "$RUN_ATTEMPT"
            printf -- '- 이미지: `%s`\n' "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-v2:
    name: v2 dev 배포
    needs: build
    # 배포 절차는 CLOUD 저장소가 관리한다. 여기서는 빌드한 이미지만 넘긴다.
    if: github.event_name == 'push' && github.ref_name == 'dev'
    permissions:
      contents: read
      id-token: write
    uses: 100-hours-a-week/KTB4-5th-CLOUD/.github/workflows/ecs-deploy.yml@main
    with:
      service: frontend
      image: ${{ needs.build.outputs.image }}

  deploy-stage:
    name: v2 stage 배포
    needs: build
    # main에 합쳐진 이미지를 stage에 바로 배포한다. prod는 이 이미지(digest)를 승인 후 그대로 쓴다.
    if: github.event_name == 'push' && github.ref_name == 'main'
    permissions:
      contents: read
      id-token: write
    uses: 100-hours-a-week/KTB4-5th-CLOUD/.github/workflows/ecs-deploy.yml@main
    with:
      env: stage
      service: app
      container: frontend
      image: ${{ needs.build.outputs.image }}
